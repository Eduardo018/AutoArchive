<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">Coleção</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand">
        <span class="shield">C</span>
        <span id="site-title">Coleção</span>
      </div>
      <p id="site-subtitle" class="subtitle"></p>
    </div>
  </header>

  <main class="container">
    <div id="stats-row" class="stats-row"></div>
    <div class="search-wrap">
      <input id="search-input" type="search" class="search-input" placeholder="Buscar por marca, modelo, cor ou ano...">
    </div>
    <div id="gallery" class="gallery"></div>
    <div id="empty" class="empty" hidden>Nenhum veículo publicado ainda.</div>
  </main>

  <footer class="footer">
    <p>Gerado automaticamente pelo AutoArchive · Vitrine somente leitura</p>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="Fechar">×</button>
      <div class="modal-photo-wrap">
        <img id="modal-photo" class="modal-photo" alt="">
        <div id="modal-thumbs" class="modal-thumbs"></div>
      </div>
      <div class="modal-body">
        <div id="modal-manufacturer" class="modal-manufacturer"></div>
        <h2 id="modal-title" class="modal-title"></h2>
        <div id="modal-tags" class="tags"></div>
        <div id="modal-specs" class="specs"></div>
        <div id="modal-market" class="market-section" hidden>
          <h3 class="market-title">Mercado</h3>
          <div id="modal-market-stats" class="market-stats"></div>
          <div class="market-chart-wrap"><canvas id="modal-market-chart"></canvas></div>
        </div>
        <div id="modal-notes" class="notes"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
